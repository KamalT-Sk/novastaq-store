<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="grad-grammarly" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0E2E24"/>
      <stop offset="100%" stop-color="#051510"/>
    </radialGradient>
    <radialGradient id="glow-grammarly" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#15C39A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#15C39A" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow-grammarly" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#15C39A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" rx="44" fill="url(#grad-grammarly)"/>
  <rect width="596" height="596" x="2" y="2" rx="42" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Brand Aura Glow -->
  <circle cx="300" cy="270" r="220" fill="url(#glow-grammarly)"/>

  <!-- Logo Icon: Grammarly G -->
  <g filter="url(#shadow-grammarly)">
    <circle cx="300" cy="270" r="90" fill="#15C39A"/>
    <path d="M260 250 C260 220 280 205 310 205 C335 205 350 218 355 235 L330 245 C326 235 320 228 310 228 C294 228 285 242 285 270 C285 298 295 312 312 312 C324 312 332 304 335 290 L305 290 L305 272 L358 272 C359 278 360 285 360 292 C360 322 342 335 310 335 C278 335 260 315 260 270 Z" fill="#051510"/>
  </g>

  <!-- Product Title -->
  <text x="300" y="445" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">GRAMMARLY</text>

  <!-- Subtitle -->
  <text x="300" y="478" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94A3B8" text-anchor="middle">AI Writing Assistant, Tone &amp; Plagiarism Detection</text>

  <!-- Badge Pill -->
  <g transform="translate(300, 520)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="-85" cy="0" r="4" fill="#15C39A"/>
    <text x="8" y="5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="0.5">Premium · 12 Months</text>
  </g>
</svg>
