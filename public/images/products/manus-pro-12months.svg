<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="grad-manus-pro-12months" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="glow-manus-pro-12months" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow-manus-pro-12months" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#38BDF8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" rx="44" fill="url(#grad-manus-pro-12months)"/>
  <rect width="596" height="596" x="2" y="2" rx="42" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Brand Aura Glow -->
  <circle cx="300" cy="270" r="220" fill="url(#glow-manus-pro-12months)"/>

  <!-- Logo Icon -->
  <g filter="url(#shadow-manus-pro-12months)">
    <path d="M220 330V220L300 290L380 220V330" fill="none" stroke="url(#manus-grad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
                   <circle cx="300" cy="180" r="16" fill="#38BDF8"/>
                   <defs><linearGradient id="manus-grad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#818CF8"/></linearGradient></defs>
  </g>

  <!-- Product Title -->
  <text x="300" y="445" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">MANUS</text>

  <!-- Subtitle -->
  <text x="300" y="478" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94A3B8" text-anchor="middle">Autonomous General AI Agent</text>

  <!-- Badge Pill -->
  <g transform="translate(300, 520)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="-85" cy="0" r="4" fill="#38BDF8"/>
    <text x="8" y="5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="0.5">Pro · 12 Months</text>
  </g>
</svg>