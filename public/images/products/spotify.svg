<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="grad-spotify" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0B170E"/>
      <stop offset="100%" stop-color="#040A06"/>
    </radialGradient>
    <radialGradient id="glow-spotify" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#1DB954" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#1DB954" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow-spotify" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1DB954" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" rx="44" fill="url(#grad-spotify)"/>
  <rect width="596" height="596" x="2" y="2" rx="42" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Brand Aura Glow -->
  <circle cx="300" cy="270" r="220" fill="url(#glow-spotify)"/>

  <!-- Logo Icon -->
  <g filter="url(#shadow-spotify)">
    <circle cx="300" cy="265" r="85" fill="#1DB954"/>
                   <path d="M245 240C280 220 330 222 360 238" fill="none" stroke="#000000" stroke-width="13" stroke-linecap="round"/>
                   <path d="M252 265C282 248 322 250 350 264" fill="none" stroke="#000000" stroke-width="11" stroke-linecap="round"/>
                   <path d="M260 290C285 276 315 278 340 289" fill="none" stroke="#000000" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Product Title -->
  <text x="300" y="445" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SPOTIFY</text>

  <!-- Subtitle -->
  <text x="300" y="478" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94A3B8" text-anchor="middle">Premium Ad-Free & Offline Music Streaming</text>

  <!-- Badge Pill -->
  <g transform="translate(300, 520)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="-85" cy="0" r="4" fill="#1DB954"/>
    <text x="8" y="5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="0.5">Premium Membership</text>
  </g>
</svg>