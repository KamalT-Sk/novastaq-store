<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="grad-linear-business-12months" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141522"/>
      <stop offset="100%" stop-color="#0B0B12"/>
    </radialGradient>
    <radialGradient id="glow-linear-business-12months" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#5E6AD2" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#5E6AD2" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow-linear-business-12months" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#5E6AD2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" rx="44" fill="url(#grad-linear-business-12months)"/>
  <rect width="596" height="596" x="2" y="2" rx="42" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Brand Aura Glow -->
  <circle cx="300" cy="270" r="220" fill="url(#glow-linear-business-12months)"/>

  <!-- Logo Icon -->
  <g filter="url(#shadow-linear-business-12months)">
    <circle cx="300" cy="270" r="85" fill="none" stroke="#5E6AD2" stroke-width="12"/>
                   <path d="M300 185C347 185 385 223 385 270" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
                   <path d="M240 270C240 237 267 210 300 210" fill="none" stroke="#8B94E5" stroke-width="10" stroke-linecap="round"/>
                   <circle cx="300" cy="270" r="16" fill="#FFFFFF"/>
  </g>

  <!-- Product Title -->
  <text x="300" y="445" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">LINEAR</text>

  <!-- Subtitle -->
  <text x="300" y="478" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94A3B8" text-anchor="middle">High-Performance Issue & Project Tracker</text>

  <!-- Badge Pill -->
  <g transform="translate(300, 520)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="-85" cy="0" r="4" fill="#5E6AD2"/>
    <text x="8" y="5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="0.5">Business · 12 Months</text>
  </g>
</svg>