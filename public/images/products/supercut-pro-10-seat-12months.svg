    <circle cx="250" cy="240" r="26" fill="none" stroke="#F43F5E" stroke-width="12"/>
                   <circle cx="350" cy="240" r="26" fill="none" stroke="#F43F5E" stroke-width="12"/>
                   <line x1="265" y1="255" x2="335" y2="325" stroke="#FB7185" stroke-width="12" stroke-linecap="round"/>
                   <line x1="335" y1="255" x2="265" y2="325" stroke="#FB7185" stroke-width="12" stroke-linecap="round"/>
  </g>

