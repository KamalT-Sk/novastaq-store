<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="grad-chatgpt" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0F2B22"/>
      <stop offset="100%" stop-color="#05120E"/>
    </radialGradient>
    <radialGradient id="glow-chatgpt" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#10A37F" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10A37F" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow-chatgpt" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10A37F" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" rx="44" fill="url(#grad-chatgpt)"/>
  <rect width="596" height="596" x="2" y="2" rx="42" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Brand Aura Glow -->
  <circle cx="300" cy="270" r="220" fill="url(#glow-chatgpt)"/>

  <!-- Logo Icon: OpenAI Knot -->
  <g filter="url(#shadow-chatgpt)" stroke="#10A37F" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M300 210 L345 235 L345 285 L300 310 L255 285 L255 235 Z"/>
    <path d="M300 170 L385 220 L385 320 L300 370 L215 320 L215 220 Z"/>
    <circle cx="300" cy="270" r="12" fill="#10A37F"/>
  </g>

  <!-- Product Title -->
  <text x="300" y="445" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">CHATGPT YEARLY</text>

  <!-- Subtitle -->
  <text x="300" y="478" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94A3B8" text-anchor="middle">GPT-4o &amp; OpenAI o1 Reasoning · Shared Account</text>

  <!-- Badge Pill -->
  <g transform="translate(300, 520)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="-85" cy="0" r="4" fill="#10A37F"/>
    <text x="8" y="5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="0.5">Shared · 12 Months</text>
  </g>
</svg>
