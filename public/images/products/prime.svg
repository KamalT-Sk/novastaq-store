<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="grad-prime" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0A141E"/>
      <stop offset="100%" stop-color="#02070D"/>
    </radialGradient>
    <radialGradient id="glow-prime" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#00A8E1" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#00A8E1" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow-prime" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00A8E1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" rx="44" fill="url(#grad-prime)"/>
  <rect width="596" height="596" x="2" y="2" rx="42" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Brand Aura Glow -->
  <circle cx="300" cy="270" r="220" fill="url(#glow-prime)"/>

  <!-- Logo Icon -->
  <g filter="url(#shadow-prime)">
    <rect x="200" y="195" width="200" height="140" rx="28" fill="#00A8E1"/>
                   <text x="300" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">prime</text>
                   <path d="M245 295C275 315 325 315 355 295" fill="none" stroke="#FF9900" stroke-width="8" stroke-linecap="round"/>
                   <path d="M352 290L358 296L350 299Z" fill="#FF9900"/>
  </g>

  <!-- Product Title -->
  <text x="300" y="445" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">AMAZON PRIME</text>

  <!-- Subtitle -->
  <text x="300" y="478" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94A3B8" text-anchor="middle">Prime Video, Free Shipping & Twitch Gaming</text>

  <!-- Badge Pill -->
  <g transform="translate(300, 520)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="-85" cy="0" r="4" fill="#00A8E1"/>
    <text x="8" y="5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="0.5">Prime Membership</text>
  </g>
</svg>